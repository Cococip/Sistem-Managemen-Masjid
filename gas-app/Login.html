<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Masuk — Masjid Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <?!= include('css_variables'); ?>
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--secondary), var(--primary-dark)); }
    .login-card { width: 100%; max-width: 400px; background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 2.25rem 2rem; }
    .login-logo { width: 64px; height: 64px; border-radius: 16px; object-fit: cover; margin: 0 auto 1rem; display: block; background: var(--primary-light); }
    .login-title { text-align: center; font-weight: 800; font-size: 1.3rem; margin-bottom: .1rem; }
    .login-sub { text-align: center; color: var(--muted); font-size: .88rem; margin-bottom: 1.6rem; }
    .form-label { font-weight: 600; font-size: .85rem; }
    .form-control { border-radius: var(--radius-sm); padding: .6rem .85rem; border-color: var(--border); }
    .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
    .btn-login { width: 100%; }
    .login-demo-hint { background: var(--primary-light); border-radius: var(--radius-sm); padding: .6rem .8rem; font-size: .78rem; color: var(--secondary); margin-top: 1.1rem; }
  </style>
</head>
<body>
  <div class="login-card fade-in">
    <img id="loginLogo" class="login-logo" src="https://api.iconify.design/mdi/mosque.svg?color=%230f9d58" alt="logo">
    <div class="login-title" id="loginMosqueName">Masjid Management System</div>
    <div class="login-sub">Silakan masuk untuk mengelola masjid</div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" id="username" required autofocus autocomplete="username">
      </div>
      <div class="mb-2">
        <label class="form-label">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" required autocomplete="current-password">
          <button class="btn btn-outline-secondary" type="button" id="togglePw"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="rememberMe" checked>
        <label class="form-check-label" for="rememberMe" style="font-size:.85rem;">Ingat saya</label>
      </div>
      <button type="submit" class="btn btn-mms btn-login" id="loginBtn">Masuk</button>
    </form>

    <div class="login-demo-hint">
      <i class="bi bi-info-circle me-1"></i>Demo: <b>admin</b>/<b>admin123</b> (Super Admin) atau <b>bendahara</b>/<b>bendahara123</b> (Bendahara)
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>var WEB_APP_URL = "<?= webAppUrl ?>";</script>
  <?!= include('js_utils'); ?>
  <?!= include('js_api'); ?>
  <?!= include('js_auth'); ?>
  <script>
    if (isLoggedIn()) {
      mmsTopNavigate(WEB_APP_URL + '?page=admin');
    }

    apiGet('getPublicSettings', {}, { noAuth: true, silent: true, silentError: true }).then(function (s) {
      if (s.mosque_name) document.getElementById('loginMosqueName').textContent = s.mosque_name;
      if (s.logo_url) document.getElementById('loginLogo').src = s.logo_url;
    }).catch(function () {});

    document.getElementById('togglePw').addEventListener('click', function () {
      var input = document.getElementById('password');
      var icon = this.querySelector('i');
      if (input.type === 'password') { input.type = 'text'; icon.className = 'bi bi-eye-slash'; }
      else { input.type = 'password'; icon.className = 'bi bi-eye'; }
    });

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;
      var remember = document.getElementById('rememberMe').checked;
      if (!username || !password) { toastWarning('Username dan password wajib diisi.'); return; }

      var restore = setButtonLoading(document.getElementById('loginBtn'), 'Masuk...');
      apiPost('login', { username: username, password: password }, { noAuth: true, successMessage: false })
        .then(function (result) {
          setAuthSession(result.token, result.user, remember);
          toastSuccess('Login berhasil. Selamat datang, ' + result.user.name + '.');
          setTimeout(function () { mmsTopNavigate(WEB_APP_URL + '?page=admin'); }, 400);
        })
        .catch(function () {})
        .finally(restore);
    });
  </script>
</body>
</html>
